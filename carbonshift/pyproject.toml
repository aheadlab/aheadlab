[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonshift"
version = "0.1.0"
description = "Auditable scheduling of flexible electricity use with Timestral"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.1", "pyarrow>=14", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]
research = ["matplotlib>=3.8,<4"]
model = ["timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
