name: capacityplanner
services:
  capacityplanner:
    build:
      context: .
      args:
        INSTALL_MODEL: "true"
    image: aheadlab-capacityplanner
    ports: ["127.0.0.1:8504:8501"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
    volumes:
      - model-cache:/home/app/.cache/huggingface:ro
      - ./results:/app/results:ro
volumes:
  model-cache:
    external: true
    name: ${CAPACITY_MODEL_VOLUME:-aheadlab-hf}
