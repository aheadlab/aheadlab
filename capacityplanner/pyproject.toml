[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacityplanner"
version = "0.1.0"
description = "CPU forecasting and reproducible capacity planning experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "statsforecast>=1.7", "pytest>=8", "pyarrow>=14"]

[project.optional-dependencies]
data = ["tables>=3.10,<4", "matplotlib>=3.8,<4"]
model = ["timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
