name: cloudguard-daily-demo
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      # No secrets, no AWS, no Telegram sends, no model weights by default.
      - run: python -m cloudguard.daily --mode synthetic --model baseline
